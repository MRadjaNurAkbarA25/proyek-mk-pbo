{% comment %}
Tombol ubah (ikon pensil). modal=True membuka overlay; label dipakai untuk title dan aria-label.
Pakai: {% include "_aksi_ubah.html" with url=url_ubah label="Ubah Wati" modal=True %}
{% endcomment %}<a href="{{ url }}" class="tombol-ikon"{% if modal %} data-modal{% endif %} title="{{ label }}" aria-label="{{ label }}"><svg class="ikon" aria-hidden="true"><use href="#i-ubah"/></svg></a>
