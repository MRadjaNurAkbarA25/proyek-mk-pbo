{% load static %}<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ nama_bengkel }}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="auth {% block body_class %}{% endblock %}">
    <header class="auth-header">
        <a href="{% url 'landing' %}" class="brand brand-besar">
            <span class="brand-logo"></span>
            <span class="brand-teks">{{ nama_bengkel }}</span>
        </a>
    </header>

    <main class="auth-grid">
        <section class="auth-form-area">
            {% if messages %}
                {% for message in messages %}
                    <div class="msg {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
            {% block content %}{% endblock %}
        </section>

        <aside class="slider" aria-hidden="true">
            <div class="slider-foto">
                <img class="aktif" src="{% static 'images/slide1.jpg' %}" alt="">
                <img src="{% static 'images/slide2.jpg' %}" alt="">
                <img src="{% static 'images/slide3.jpg' %}" alt="">
            </div>
            <div class="slider-titik"><span class="aktif"></span><span></span><span></span></div>
        </aside>
    </main>
    <script src="{% static 'js/slider.js' %}"></script>
</body>
</html>
