<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sistem Bengkel{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; }
        .container { max-width: 400px; margin: 60px auto; background: #fff;
                     padding: 30px; border-radius: 8px; box-shadow: 0 0 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 20px; }
        label { display: block; margin-top: 12px; font-size: 14px; }
        input, textarea { width: 100%; padding: 8px; margin-top: 4px;
                           box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; margin-top: 20px; padding: 10px; background: #2f5496;
                 color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #24406f; }
        .msg { padding: 10px; margin-bottom: 10px; border-radius: 4px; }
        .msg.success { background: #d4edda; color: #155724; }
        .msg.error, .msg.warning { background: #f8d7da; color: #721c24; }
        .msg.info { background: #d1ecf1; color: #0c5460; }
        .footer-link { text-align: center; margin-top: 16px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="msg {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
