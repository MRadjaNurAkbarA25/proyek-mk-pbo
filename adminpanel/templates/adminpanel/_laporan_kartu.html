{% comment %}
Kartu ringkasan angka laporan; warna opsional (kelas warna Bootstrap).
Pakai: {% include "adminpanel/_laporan_kartu.html" with label="..." angka=... keterangan="..." warna="text-danger" %}
{% endcomment %}
<div class="col-sm-6 col-xl">
    <div class="card border-0 shadow-sm h-100"><div class="card-body">
        <div class="text-uppercase text-muted small fw-semibold">{{ label }}</div>
        <div class="h3 fw-bold mb-1 {{ warna }}">{{ angka }}</div>
        {% if keterangan %}<div class="small text-muted">{{ keterangan }}</div>{% endif %}
    </div></div>
</div>
