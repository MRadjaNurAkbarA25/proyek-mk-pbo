{% comment %}Satu isian form kendaraan: label, kolom, teks bantuan, galat. Pakai: {% include "pelanggan/_isian.html" with field=form.merk %}{% endcomment %}
<div class="isian{% if field.errors %} ada-galat{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<small class="isian-bantuan">{{ field.help_text }}</small>{% endif %}
    {% for error in field.errors %}<small class="isian-galat">{{ error }}</small>{% endfor %}
</div>
