{% extends "mekanik/base.html" %}
{% block title %}{{ judul }}{% endblock %}
{% block content %}
<h2>{{ judul }}</h2>
<form method="post" class="col-md-6">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
        <div class="mb-3">
            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
        </div>
    {% endfor %}
    <button class="btn btn-primary">Simpan</button>
    <a href="{% url 'kelola_jenis' %}" class="btn btn-link">Batal</a>
</form>
<script>
    document.querySelectorAll("form input:not([type=hidden]), form select, form textarea")
        .forEach(function (el) { el.classList.add(el.tagName === "SELECT" ? "form-select" : "form-control"); });
</script>
{% endblock %}
