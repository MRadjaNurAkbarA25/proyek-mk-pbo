{# Badge status transaksi. Butuh variabel `t` (TransaksiServis). #}
<span class="badge-st {% if t.status == 'SELESAI' %}hijau{% elif t.status == 'DIBATALKAN' %}merah{% elif t.status == 'DIKERJAKAN' %}biru{% elif t.status == 'MENUNGGU_KONFIRMASI_MEKANIK' or t.status == 'MENUNGGU_KONFIRMASI' or t.status == 'MENUNGGU' %}kuning{% else %}abu{% endif %}">{{ t.get_status_display }}</span>
