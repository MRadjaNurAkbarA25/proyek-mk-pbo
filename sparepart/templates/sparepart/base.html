<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sparepart{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        {# 'dashboard' mengarahkan ke dashboard sesuai role (Admin/Kasir/Mekanik) #}
        <a class="navbar-brand" href="{% url 'dashboard' %}">Bengkel</a>
        <div class="d-flex align-items-center">
            <a href="{% url 'sparepart:sparepart_list' %}" class="btn btn-outline-light btn-sm me-2">Daftar Sparepart</a>
            <a href="{% url 'sparepart:peringatan_stok' %}" class="btn btn-outline-light btn-sm me-3">Peringatan Stok</a>
            <span class="navbar-text text-white me-3">Halo, {{ user.username }}</span>
            <form method="post" action="{% url 'logout' %}">{% csrf_token %}
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>
<div class="container">
    {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
    <p class="mt-4"><a href="{% url 'dashboard' %}">&larr; Kembali ke Dashboard</a></p>
</div>
</body>
</html>
