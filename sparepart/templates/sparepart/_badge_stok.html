{% comment %}
Badge kondisi stok (dari Sparepart.status_stok); di sini hanya pemetaan ke warna.
Pakai: {% include "sparepart/_badge_stok.html" with s=s %} (st=True untuk .badge-st)
{% endcomment %}
{% if st %}<span class="badge-st {% if s.status_stok == 'KOSONG' %}merah{% elif s.status_stok == 'MINIM' %}kuning{% else %}hijau{% endif %}">{{ s.label_stok }}</span>{% else %}<span class="badge text-bg-{% if s.status_stok == 'KOSONG' %}danger{% elif s.status_stok == 'MINIM' %}warning{% else %}success{% endif %}">{{ s.label_stok }}</span>{% endif %}
